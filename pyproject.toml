[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megmis"
version = "0.1.0"
description = "Mamiriro (MEGMIS) — Zimbabwe weather, geospatial, safe routing, road conditions, and journey-risk intelligence via REST + MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Walter Kudzai Kamanga", email = "walter-kudzai-kamanga@users.noreply.github.com" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "fastapi",
  "weather",
  "routing",
  "geospatial",
  "zimbabwe",
  "mamiriro",
  "postgis",
  "prototype",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.163.0",
  "uvicorn[standard]>=0.34.0",
  "mcp>=2.3.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "geoalchemy2>=0.15.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-bdd>=8.1.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "httpx>=0.28.0",
  "build>=1.2.0",
  "twine>=6.0.0",
]
voice = [
  "faster-whisper>=1.1.0",
  "edge-tts>=7.0.0",
  "numpy>=2.0.0",
  "soundfile>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/walter-kudzai-kamanga/megmis"
Repository = "https://github.com/walter-kudzai-kamanga/megmis"
Issues = "https://github.com/walter-kudzai-kamanga/megmis/issues"
Documentation = "https://github.com/walter-kudzai-kamanga/megmis/tree/main/docs"
"MCP Registry" = "https://github.com/walter-kudzai-kamanga/megmis/blob/main/server.json"

[project.scripts]
megmis-api = "megmis.main:run_api"
megmis-mcp = "megmis.mcp_stdio:main"
megmis-worker = "megmis.worker:main"

[tool.hatch.build.targets.sdist]
include = [
  "src/megmis",
  "README.md",
  "LICENSE",
  "server.json",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/megmis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs PostGIS + Redis",
  "bdd: gherkin acceptance",
]

[tool.coverage.run]
source = ["megmis"]
branch = true
omit = ["*/mcp_stdio.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042", "UP046"]
