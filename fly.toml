# Fly.io — HTTPS MCP (prototype, in-memory).
# Setup once:
#   curl -L https://fly.io/install.sh | sh
#   fly auth login
#   fly apps create megmis-api   # pick a free name if taken
#   fly secrets set DEV_API_KEY="$(openssl rand -hex 24)" PUBLIC_BASE_URL="https://megmis-api.fly.dev"
#   fly deploy
# Verify:
#   ./scripts/verify_remote_mcp.sh https://megmis-api.fly.dev

app = "megmis-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  USE_PERSISTENCE = "false"
  USE_APP_ROLE = "false"
  WEATHER_PROVIDER = "mock"
  ROUTING_PROVIDER = "mock"
  GEOCODE_PROVIDER = "mock"
  SPEECH_PROVIDER = "mock"
  STRUCTURED_LOGS = "true"
  RATE_LIMIT_PER_MINUTE = "60"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
