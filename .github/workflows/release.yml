# Publish megmis to PyPI + MCP Registry.
# PyPI Trusted Publisher (one-time on https://pypi.org/manage/account/publishing/):
#   Owner: walter-kudzai-kamanga | Repo: megmis | Workflow: release.yml | Env: pypi
# GitHub Environment: Settings → Environments → pypi
#
# Publish triggers:
#   - git tag vX.Y.Z && git push origin vX.Y.Z
#   - Actions → release → Run workflow → publish=true

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to PyPI + MCP Registry (not just build)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install -U pip build twine
      - name: Install project and dependencies
        run: python -m pip install .
      - name: Sync identity (version / mcp-name)
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from megmis import __version__
          from megmis.mcp.runtime import MCP_SERVER_NAME

          assert __version__
          pyproject = Path("pyproject.toml").read_text()
          m = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.M)
          assert m and m.group(1) == __version__, (m and m.group(1), __version__)
          manifest = json.loads(Path("server.json").read_text())
          assert manifest["version"] == __version__
          assert manifest["name"] == MCP_SERVER_NAME
          packages = manifest.get("packages") or []
          if packages:
              assert packages[0]["version"] == __version__
              assert packages[0]["identifier"] == "megmis"
          remotes = manifest.get("remotes") or []
          assert packages or remotes, "server.json needs packages and/or remotes"
          readme = Path("README.md").read_text()
          assert f"mcp-name: {MCP_SERVER_NAME}" in readme
          print("identity OK", MCP_SERVER_NAME, __version__, "packages", len(packages), "remotes", len(remotes))
          PY
        env:
          PYTHONPATH: src
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes always publish; manual runs only when publish=true (default).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment:
      name: pypi
      url: https://pypi.org/p/megmis
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Avoid attestation failures blocking first Trusted Publisher upload.
          attestations: false
          # Retries / re-dispatch after a green publish should not fail the run.
          skip-existing: true

  # Official MCP Registry (metadata). Prefer remotes until PyPI package is live;
  # after PyPI ships, include packages[] so ownership verification can pass.
  mcp-registry:
    needs: [build]
    runs-on: ubuntu-latest
    # Don't fail the whole release if only the registry job fails.
    continue-on-error: true
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Choose manifest (remote-only until PyPI exists)
        id: manifest
        run: |
          set -euo pipefail
          if curl -fsS "https://pypi.org/pypi/megmis/json" >/dev/null 2>&1; then
            echo "path=server.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=server.remote.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Preflight validate description length
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["MANIFEST_PATH"])
          data = json.loads(path.read_text())
          desc = data.get("description") or ""
          print(f"manifest={path} name={data.get('name')} version={data.get('version')} desc_len={len(desc)}")
          if len(desc) > 100:
              print(f"::error file={path}::description is {len(desc)} chars; registry caps at 100")
              sys.exit(1)
          PY
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tgz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc
      - name: Validate manifest
        run: mcp-publisher validate "${{ steps.manifest.outputs.path }}"
      - name: Publish to MCP Registry
        run: mcp-publisher publish "${{ steps.manifest.outputs.path }}"

  # Optional container image for self-hosters (Render already builds from Dockerfile).
  container:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image tags
        id: meta
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/megmis"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
