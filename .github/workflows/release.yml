# Publish megmis to PyPI using GitHub Actions Trusted Publishing.

name: release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build and validate package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Install project
        run: python -m pip install .

      - name: Validate package identity
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          from megmis import __version__
          from megmis.mcp.runtime import MCP_SERVER_NAME

          assert __version__, "Package version is missing"

          # Validate pyproject.toml
          pyproject = Path("pyproject.toml").read_text()
          match = re.search(
              r'^version\s*=\s*"([^"]+)"',
              pyproject,
              re.M
          )

          assert match, "Version missing from pyproject.toml"
          assert match.group(1) == __version__

          # Validate server manifest
          manifest = json.loads(
              Path("server.json").read_text()
          )

          assert manifest["version"] == __version__
          assert manifest["packages"][0]["version"] == __version__
          assert manifest["name"] == MCP_SERVER_NAME

          # Validate README MCP identity
          readme = Path("README.md").read_text()

          assert (
              f"mcp-name: {MCP_SERVER_NAME}" in readme
          ), "MCP server name mismatch in README"

          # Validate Git tag version
          tag = os.environ.get("GITHUB_REF_NAME", "")

          if tag.startswith("v"):
              tag_version = tag[1:]

              assert tag_version == __version__, (
                  f"Git tag {tag_version} does not match "
                  f"package version {__version__}"
              )

          print(
              f"Identity validated: {MCP_SERVER_NAME} "
              f"v{__version__}"
          )
          PY

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/megmis

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
