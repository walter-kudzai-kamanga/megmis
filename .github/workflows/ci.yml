name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: megmis
          POSTGRES_USER: megmis
          POSTGRES_PASSWORD: megmis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U megmis -d megmis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://megmis:megmis@localhost:5433/megmis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify package installation
        run: |
          python -c "import megmis; print('megmis:', megmis.__version__)"
          python -c "import mcp; print('MCP SDK:', mcp.__file__)"

      - name: Check PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg

          connection = psycopg.connect(os.environ["DATABASE_URL"])
          print("PostgreSQL connection successful")
          connection.close()
          PY

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Run Unit Tests
        run: python -m pytest tests/ -v
