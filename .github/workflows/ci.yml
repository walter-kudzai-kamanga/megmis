name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e . 
          python -c "import mcp; print(mcp.__file__)"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Validate MCP server.json + registry identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from megmis.mcp.runtime import MCP_SERVER_NAME, MCP_VERSION
          root = Path(".")
          manifest = json.loads((root / "server.json").read_text())
          assert manifest["name"] == MCP_SERVER_NAME
          assert manifest["version"] == MCP_VERSION
          assert manifest["packages"][0]["identifier"] == "megmis"
          readme = (root / "README.md").read_text()
          assert f"mcp-name: {MCP_SERVER_NAME}" in readme
          print("server.json OK", MCP_SERVER_NAME, MCP_VERSION)
          PY
      - name: Unit + contract + bdd + tenant isolation
        env:
          USE_PERSISTENCE: "false"
          USE_APP_ROLE: "false"
        run: |
          pytest -q \
            --cov=megmis \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: megmis
          POSTGRES_PASSWORD: megmis
          POSTGRES_DB: megmis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U megmis -d megmis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Migrate + seed
        env:
          DATABASE_URL: postgresql+psycopg://megmis:megmis@localhost:5432/megmis
          DATABASE_APP_URL: postgresql+psycopg://megmis_app:megmis_app@localhost:5432/megmis
          REDIS_URL: redis://localhost:6379/0
          USE_PERSISTENCE: "true"
          USE_APP_ROLE: "true"
        run: |
          alembic upgrade head
          python scripts/seed.py
      - name: Gen1 + Gen2 integration (tenant isolation gate)
        env:
          DATABASE_URL: postgresql+psycopg://megmis:megmis@localhost:5432/megmis
          DATABASE_APP_URL: postgresql+psycopg://megmis_app:megmis_app@localhost:5432/megmis
          REDIS_URL: redis://localhost:6379/0
          USE_PERSISTENCE: "true"
          USE_APP_ROLE: "true"
          INTEGRATION: "1"
          RATE_LIMIT_PER_MINUTE: "100000"
        run: |
          pytest -q \
            tests/test_integration_persistence.py \
            tests/test_tenant_isolation.py \
            tests/test_gen2_platform.py \
            --cov=megmis.engines.routing.cost_model --cov-fail-under=90

  images:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Build api + worker (+ console) images
        run: |
          docker build --target prod -t megmis-api:ci .
          docker build --target prod -t megmis-worker:ci .
          docker build --target prod -t megmis-console:ci .
